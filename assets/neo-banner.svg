<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEO // HCW5 Cyberpunk Banner</title>
  <desc id="desc">Dark neon green cyberpunk profile banner with matrix-style lines and terminal prompt text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="1" stop-color="#041D19"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00F5C6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5C6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00F5C6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <g opacity="0.5">
    <rect x="40" y="50" width="1120" height="2" fill="url(#line)"/>
    <rect x="40" y="105" width="1120" height="1.5" fill="url(#line)"/>
    <rect x="40" y="160" width="1120" height="1.5" fill="url(#line)"/>
    <rect x="40" y="215" width="1120" height="2" fill="url(#line)"/>
  </g>

  <text x="60" y="105" fill="#84FFE6" font-family="'Courier New', monospace" font-size="58" font-weight="700" filter="url(#glow)">
    NEO // HCW5
  </text>

  <text x="62" y="145" fill="#31D9C7" font-family="'Courier New', monospace" font-size="22" opacity="0.95">
    &gt; cyberpunk code matrix
  </text>

  <text x="62" y="188" fill="#A8FFF2" font-family="'Courier New', monospace" font-size="18" opacity="0.9">
    $ build --lang c --lang python --lang go
  </text>
</svg>
